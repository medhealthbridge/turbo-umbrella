name: Publish next book to Gumroad

on:
  schedule:
    # 09:13 Singapore / Manila time (01:13 UTC), daily.
    - cron: "13 1 * * *"
  workflow_dispatch:
    inputs:
      slug:
        description: "Publish one specific book slug now (leave blank for the next in queue)"
        required: false
        default: ""
      dry_run:
        description: "Dry run - do everything except actually create the product"
        type: boolean
        required: false
        default: false

# Allow the job to commit the updated state file back to the repo.
permissions:
  contents: write

concurrency:
  group: gumroad-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install --quiet -r requirements.txt

      - name: Install Gumroad CLI
        run: |
          set -euo pipefail
          if curl -fsSL https://gumroad.com/install-cli.sh -o /tmp/install-gumroad.sh; then
            bash /tmp/install-gumroad.sh
          else
            echo "Install script unavailable, falling back to go install"
            go install github.com/antiwork/gumroad-cli/cmd/gumroad@latest
            echo "$HOME/go/bin" >> "$GITHUB_PATH"
          fi

      - name: Verify Gumroad CLI
        run: |
          export PATH="$HOME/.local/bin:$HOME/go/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          gumroad --version || true
          gumroad products --help || true

      - name: Publish next book
        env:
          GUMROAD_ACCESS_TOKEN: ${{ secrets.GUMROAD_ACCESS_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID }}
          ONLY_SLUG: ${{ inputs.slug }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python scripts/publish.py

      - name: Commit updated state
        if: ${{ inputs.dry_run != true }}
        run: |
          set -euo pipefail
          if git diff --quiet -- state/published.json; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name "gumroad-autopost"
          git config user.email "actions@github.com"
          git add state/published.json
          git commit -m "chore: record published book [skip ci]"
          git push
