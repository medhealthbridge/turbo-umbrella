name: Deploy dashboard

# Publishes docs/ to GitHub Pages, so the status page has a URL you can open
# on your phone.
#
# One-time setup: Settings → Pages → Build and deployment → Source:
# "GitHub Actions". Then run this workflow once.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Make sure there is something to deploy
        run: |
          if [ ! -f docs/index.html ]; then
            echo "docs/index.html does not exist yet."
            echo "Run the Publish workflow with command=dashboard first."
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
