name: Check

# Runs the end-to-end smoke test against a stand-in Gumroad CLI. No network,
# no secrets, nothing published — so it is safe on every push and PR, and it
# catches a broken publisher before the next morning's real run does.

on:
  push:
    branches: [main]
    paths: &watched
      - "scripts/**"
      - "config.yml"
      - "tests/**"
      - "requirements*.txt"
      # The workflows themselves: a change to a runner image, an action
      # version or a step has to be verified too, and only this job can
      # do that.
      - ".github/workflows/**"
  pull_request:
    paths: *watched
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --quiet -r requirements.txt -r requirements-dev.txt
      - name: Compile every module
        run: python -m compileall -q scripts
      - name: Validate config.yml
        run: python scripts/publish.py plan
      - name: Smoke test
        run: python tests/smoke.py
